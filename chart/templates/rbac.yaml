apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "guardrail.fullname" . }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "guardrail.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "guardrail.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "guardrail.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "guardrail.fullname" . }}-remediations
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "guardrail.fullname" . }}-remediations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "guardrail.fullname" . }}-remediations
subjects:
  - kind: ServiceAccount
    name: {{ include "guardrail.fullname" . }}
    namespace: {{ .Release.Namespace }}
